name: CI

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]

jobs:
  build-and-test:
    name: ${{ matrix.os }} / ${{ matrix.compiler }} / ${{ matrix.allocator }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ ubuntu-24.04, ubuntu-22.04 ]
        compiler: [ gcc, clang ]
        allocator: [ default ]
        include:
          - os: ubuntu-24.04
            compiler: gcc
            allocator: mimalloc
          - os: ubuntu-24.04
            compiler: gcc
            allocator: jemalloc

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            cmake \
            pkg-config \
            libnghttp2-dev \
            zlib1g-dev \
            libzstd-dev \
            libsnappy-dev \
            libssl-dev \
            uuid-dev \
            libprotobuf-c-dev \
            protobuf-c-compiler \
            protobuf-compiler \
            libuv1-dev \
            libmimalloc-dev \
            libjemalloc-dev

      - name: Install Python dependencies
        run: |
          python3 -m pip install --upgrade pip
          python3 -m pip install grpcio grpcio-tools protobuf

      - name: Build grpc and examples
        run: |
          cmake -S . -B build \
            -DCMAKE_C_COMPILER=${{ matrix.compiler }} \
            -DGRPC_ALLOCATOR=${{ matrix.allocator }}
          cmake --build build --parallel 2

      - name: Run unit and integration tests
        run: |
          ctest --test-dir build --output-on-failure

  sanitizers:
    name: ASAN / ${{ matrix.compiler }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        compiler: [ gcc, clang ]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            cmake \
            pkg-config \
            libnghttp2-dev \
            zlib1g-dev \
            libzstd-dev \
            libsnappy-dev \
            libssl-dev \
            uuid-dev \
            libprotobuf-c-dev \
            protobuf-c-compiler \
            protobuf-compiler \
            libuv1-dev

      - name: Install Python dependencies
        run: |
          python3 -m pip install --upgrade pip
          python3 -m pip install grpcio grpcio-tools protobuf

      - name: Build and test under AddressSanitizer
        run: |
          cmake -S . -B build \
            -DCMAKE_C_COMPILER=${{ matrix.compiler }} \
            -DGRPC_ASAN=ON
          cmake --build build --parallel 2
          ctest --test-dir build --output-on-failure

  tls-backends:
    name: TLS / ${{ matrix.tls }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        # openssl is covered by the jobs above. wolfssl and gnutls come from
        # the distribution, the others are built by scripts/build-tls-backend.sh
        tls: [ libressl, boringssl, awslc, wolfssl, gnutls, rustls ]

    env:
      TLS_PREFIX_DIR: ${{ github.workspace }}/.tls/${{ matrix.tls }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            pkg-config \
            cmake \
            ninja-build \
            libnghttp2-dev \
            zlib1g-dev \
            libssl-dev \
            uuid-dev \
            libprotobuf-c-dev \
            protobuf-c-compiler \
            protobuf-compiler \
            libuv1-dev \
            libwolfssl-dev \
            libgnutls28-dev

      - name: Install Python dependencies
        run: |
          python3 -m pip install --upgrade pip
          python3 -m pip install grpcio grpcio-tools protobuf

      - name: Cache the TLS library build
        if: matrix.tls != 'wolfssl' && matrix.tls != 'gnutls'
        id: tls-cache
        uses: actions/cache@v4
        with:
          path: ${{ env.TLS_PREFIX_DIR }}
          key: tls-${{ matrix.tls }}-${{ runner.os }}-${{ hashFiles('scripts/build-tls-backend.sh') }}

      - name: Build the TLS library
        if: matrix.tls != 'wolfssl' && matrix.tls != 'gnutls' && steps.tls-cache.outputs.cache-hit != 'true'
        run: scripts/build-tls-backend.sh ${{ matrix.tls }} "$TLS_PREFIX_DIR" "$RUNNER_TEMP/tls-src"

      - name: Build and test
        run: |
          cmake -S . -B build \
            -DGRPC_TLS_BACKEND=${{ matrix.tls }} \
            -DGRPC_TLS_PREFIX="$TLS_PREFIX_DIR"
          cmake --build build --parallel 2
          ctest --test-dir build --output-on-failure

  flatbuffers:
    name: FlatBuffers / ${{ matrix.compiler }}${{ matrix.asan == '1' && ' / ASAN' || '' }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - compiler: gcc
            asan: '0'
          - compiler: clang
            asan: '0'
          - compiler: gcc
            asan: '1'

    env:
      FLATCC_PREFIX_DIR: ${{ github.workspace }}/.flatcc

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            pkg-config \
            cmake \
            ninja-build \
            libnghttp2-dev \
            zlib1g-dev \
            libssl-dev \
            uuid-dev \
            libprotobuf-c-dev \
            protobuf-c-compiler \
            protobuf-compiler \
            libuv1-dev

      - name: Install Python dependencies
        run: |
          python3 -m pip install --upgrade pip
          python3 -m pip install grpcio grpcio-tools protobuf flatbuffers==25.12.19

      - name: Cache the flatcc build
        id: flatcc-cache
        uses: actions/cache@v4
        with:
          path: ${{ env.FLATCC_PREFIX_DIR }}
          key: flatcc-${{ runner.os }}-${{ hashFiles('scripts/build-flatcc.sh') }}

      - name: Build flatcc
        if: steps.flatcc-cache.outputs.cache-hit != 'true'
        run: scripts/build-flatcc.sh "$FLATCC_PREFIX_DIR" "$RUNNER_TEMP/flatcc-src"

      - name: Build and test
        run: |
          cmake -S . -B build \
            -DCMAKE_C_COMPILER=${{ matrix.compiler }} \
            -DGRPC_ASAN=${{ matrix.asan == '1' && 'ON' || 'OFF' }} \
            -DGRPC_FLATCC=ON \
            -DGRPC_FLATCC_PREFIX="$FLATCC_PREFIX_DIR"
          cmake --build build --parallel 2
          ctest --test-dir build --output-on-failure
