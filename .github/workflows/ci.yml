name: CI

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]

jobs:
  build-and-test:
    name: ${{ matrix.os }} / ${{ matrix.compiler }} / ${{ matrix.allocator }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ ubuntu-24.04, ubuntu-22.04 ]
        compiler: [ gcc, clang ]
        allocator: [ default ]
        include:
          - os: ubuntu-24.04
            compiler: gcc
            allocator: mimalloc
          - os: ubuntu-24.04
            compiler: gcc
            allocator: jemalloc

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            pkg-config \
            libnghttp2-dev \
            zlib1g-dev \
            libssl-dev \
            uuid-dev \
            libprotobuf-c-dev \
            protobuf-c-compiler \
            protobuf-compiler \
            libuv1-dev \
            libmimalloc-dev \
            libjemalloc-dev

      - name: Install Python dependencies
        run: |
          python3 -m pip install --upgrade pip
          python3 -m pip install grpcio grpcio-tools protobuf

      - name: Build ezgrpc2 and examples
        run: |
          make clean
          make CC=${{ matrix.compiler }} ALLOCATOR=${{ matrix.allocator }}

      - name: Run unit tests
        run: |
          make -C src/tests test CC=${{ matrix.compiler }} ALLOCATOR=${{ matrix.allocator }}

      - name: Run Python client integration tests (Cleartext h2c)
        run: |
          make -C examples/python_client_c_server test CC=${{ matrix.compiler }} ALLOCATOR=${{ matrix.allocator }}

      - name: Run Python client integration tests (TLS / SSL h2)
        run: |
          make -C examples/python_client_c_server test-tls CC=${{ matrix.compiler }} ALLOCATOR=${{ matrix.allocator }}

  sanitizers:
    name: ASAN / ${{ matrix.compiler }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        compiler: [ gcc, clang ]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            pkg-config \
            libnghttp2-dev \
            zlib1g-dev \
            libssl-dev \
            uuid-dev \
            libprotobuf-c-dev \
            protobuf-c-compiler \
            protobuf-compiler \
            libuv1-dev

      - name: Install Python dependencies
        run: |
          python3 -m pip install --upgrade pip
          python3 -m pip install grpcio grpcio-tools protobuf

      - name: Build and test under AddressSanitizer
        run: |
          make clean
          make CC=${{ matrix.compiler }} ASAN=1
          make -C src/tests test CC=${{ matrix.compiler }} ASAN=1
          make -C examples/python_client_c_server test CC=${{ matrix.compiler }} ASAN=1
          make -C examples/python_client_c_server test-tls CC=${{ matrix.compiler }} ASAN=1

  tls-backends:
    name: TLS / ${{ matrix.tls }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        # openssl is covered by the jobs above. wolfssl and gnutls come from
        # the distribution, the others are built by scripts/build-tls-backend.sh
        tls: [ libressl, boringssl, awslc, wolfssl, gnutls, rustls ]

    env:
      TLS_PREFIX_DIR: ${{ github.workspace }}/.tls/${{ matrix.tls }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            pkg-config \
            cmake \
            ninja-build \
            libnghttp2-dev \
            zlib1g-dev \
            libssl-dev \
            uuid-dev \
            libprotobuf-c-dev \
            protobuf-c-compiler \
            protobuf-compiler \
            libuv1-dev \
            libwolfssl-dev \
            libgnutls28-dev

      - name: Install Python dependencies
        run: |
          python3 -m pip install --upgrade pip
          python3 -m pip install grpcio grpcio-tools protobuf

      - name: Cache the TLS library build
        if: matrix.tls != 'wolfssl' && matrix.tls != 'gnutls'
        id: tls-cache
        uses: actions/cache@v4
        with:
          path: ${{ env.TLS_PREFIX_DIR }}
          key: tls-${{ matrix.tls }}-${{ runner.os }}-${{ hashFiles('scripts/build-tls-backend.sh') }}

      - name: Build the TLS library
        if: matrix.tls != 'wolfssl' && matrix.tls != 'gnutls' && steps.tls-cache.outputs.cache-hit != 'true'
        run: scripts/build-tls-backend.sh ${{ matrix.tls }} "$TLS_PREFIX_DIR" "$RUNNER_TEMP/tls-src"

      - name: Select the TLS library
        run: |
          if [ "${{ matrix.tls }}" = wolfssl ] || [ "${{ matrix.tls }}" = gnutls ]; then
            echo "TLS_ARGS=TLS=${{ matrix.tls }}" >> "$GITHUB_ENV"
          else
            echo "TLS_ARGS=TLS=${{ matrix.tls }} TLS_PREFIX=$TLS_PREFIX_DIR" >> "$GITHUB_ENV"
          fi

      - name: Build and test
        run: |
          make clean
          make $TLS_ARGS
          make -C src/tests test $TLS_ARGS
          make -C examples/python_client_c_server test $TLS_ARGS
          make -C examples/python_client_c_server test-tls $TLS_ARGS
